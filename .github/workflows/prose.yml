name: Prose

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  prose:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # ai-tells identifies common AI-written prose patterns. The style package
      # is pinned in .vale.ini, and vale sync downloads it into the gitignored
      # styles directory.
      - name: Sync Vale styles
        run: uvx vale@3.13.0.0 sync
      - name: Lint prose
        run: git ls-files '*.md' '*.rst' | xargs --no-run-if-empty uvx vale@3.13.0.0
