included:
  - Sources
  - Tests

excluded:
  - .build

disabled_rules:
  # `swift format` owns these rules and intentionally formats multiline conditions
  # and collection literals differently from SwiftLint's defaults.
  - opening_brace
  - trailing_comma

file_length:
  # The public API and its private on-disk implementation intentionally stay together so the
  # generic nested envelope and claim types do not leak beyond this source file.
  warning: 550
  error: 700

type_body_length:
  warning: 450
  error: 550

function_body_length:
  warning: 80
  error: 120
