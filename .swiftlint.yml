included:
  - Sources
  - Tests

excluded:
  - .build

disabled_rules:
  # `swift format` owns these rules and intentionally formats multiline conditions
  # and collection literals differently from SwiftLint's defaults.
  - opening_brace
  - trailing_comma

file_length:
  # Nested mailbox types, maintenance paths, and multiprocess tests share files on purpose.
  warning: 950
  error: 1100

type_body_length:
  warning: 850
  error: 950

function_body_length:
  warning: 100
  error: 150

cyclomatic_complexity:
  warning: 25
  error: 35

nesting:
  # Envelope/CodingKeys and small Codable fixtures nested in tests are intentional.
  type_level: 2
  always_allow_one_type_in_functions: true
  ignore_coding_keys: true
