included:
  - Sources
  - Tests

excluded:
  - .build

disabled_rules:
  # `swift format` owns these rules and intentionally formats multiline conditions
  # and collection literals differently from SwiftLint's defaults.
  - opening_brace
  - trailing_comma

file_length:
  # Nested mailbox types, maintenance paths, and multiprocess tests share files on purpose.
  warning: 800
  error: 1000

type_body_length:
  warning: 600
  error: 800

function_body_length:
  warning: 100
  error: 150

cyclomatic_complexity:
  warning: 20
  error: 30
